<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Success</title>
    <style>
        :root {
            --primary-color: #28a745; /* 改为绿色主题 */
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --light-text: #6c757d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--secondary-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .success-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--light-text);
            margin-bottom: 2rem;
        }

        .actions {
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #218838; /* 深绿色悬停效果 */
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: var(--light-text);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-icon">✓</div>
    <h1>Operation Successful!</h1>
    <p class="subtitle">Welcome to simpleioc. Your action has been completed successfully.</p>

    <div class="actions">
        <a href="/dashboard" class="btn">Go to Dashboard</a>
    </div>
</div>

<footer>
    &copy; 2023 Your Company. All rights reserved.
</footer>
</body>


</html>
